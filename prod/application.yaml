apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vote-PROD
  namespace: argocd
spec:
  destination:
    namespace: prod
    server: https://kubernetes.default.svc
  project: instavote
  source:
    path: prod
    repoURL: https://github.com/vpovarych/argo-rollout.git
    targetRevision: release
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
